name: <Name>
services:
  server:
    image: <Image>
    env_file:
      - .env
    environment:
      - NODE_ENV=production
  reverse-proxy:
    image: nginx:latest
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
